# CareerCrew 容器部署配置（docker-compose 配套）
# 与 settings.yaml 结构一致，差异仅三处：vector_store.url 指向 qdrant 服务名、
# embedding.model_path 指向容器内挂载路径、langsmith 默认关闭。
# 启用方式：环境变量 CAREERCREW_SETTINGS_PATH=/app/config/settings.docker.yaml
# （compose 已设置，本地开发不受影响。）

llm:
  provider: openai
  model: "qwen-plus"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "${DASHSCOPE_API_KEY}"
  temperature: 0.3
  max_tokens: 4096

embedding:
  provider: bge_m3_local
  model: BAAI/bge-m3
  model_path: "${CAREERCREW_EMBEDDING_MODEL_PATH:-/models/bge-m3}"  # compose 挂载宿主机 ./models/bge-m3
  use_fp16: false
  batch_size: 12
  device: cpu                       # cpu（默认，避免显存叠加 OOM）| cuda（有卡机型提速明显）

rerank:
  backend: dashscope
  model: "gte-rerank-v2"
  base_url: "https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank"
  api_key: "${DASHSCOPE_API_KEY}"
  top_m: 30

vector_store:
  backend: qdrant
  url: http://qdrant:6333           # compose 服务名
  api_key: "${QDRANT_API_KEY}"
  colbert_multivector: false        # M7：与 rag.retrieval.colbert_rerank 同开（见主配置注释）
  collections:
    knowledge: careercrew_mm
    episodic_memory: careercrew_episodic_v2
    conversation_messages: careercrew_workspace_messages

rag:
  retrieval:
    mode: hybrid
    fusion_algorithm: rrf
    top_k_dense: 20
    top_k_sparse: 20
    top_k_final: 10
    crag: false                  # M5：检索质量自评估（incorrect -> LLM 重写重检一轮）
    colbert_rerank: false        # M7：ColBERT late-interaction 本地精排（需同开 colbert_store）
    colbert_store: false         # M7：摄取时把 colbert 矩阵写入 payload（库体积显著增大）
  chunking:
    strategy: recursive
    chunk_size: 800
    chunk_overlap: 100
    contextual: false               # 生产默认关闭（LLM 成本）；按知识库开启见 README
  loaders:
    backend: mineru
    provider: api
    api_key: "${MINERU_API_KEY}"
    model_version: vlm
    poll_interval: 5
    timeout: 1800
    output_dir: /app/data/parsed
    device: cpu
    method: auto
    formula: true
    table: true
    language: ch

vlm:
  model: "qwen-vl-max"
  rerank_model: ""
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "${DASHSCOPE_API_KEY}"

supervisor:
  checkpointer:
    backend: postgres
    url: "${DATABASE_URL}"
  max_consecutive_agent_turns: 10

memory:
  enabled: false
  postgres:
    dsn: "${DATABASE_URL}"
  episodic:
    collection: careercrew_episodic_v2
    vectorize: true
  compaction:
    enabled: true
    token_threshold_ratio: 0.7
    retention_tokens: 20000
  router:
    top_n: 5
    max_inject_tokens: 2000
  consolidation:
    min_interval_hours: 24
    min_sessions: 5
    # dream_schedule 在 docker 变体不预设（容器时区不定），需要时手动加：
    # dream_schedule: "03:30"

tools:
  search:
    boss_cdp_url: "http://host.docker.internal:9222"
                                  # 容器内指向宿主机 Chrome 的调试端口（N1）：
                                  # 宿主机以 --remote-debugging-port=9222 启动 Chrome。
                                  # 空=两条渠道（Boss 与猎聘）都禁用——猎聘同样已 CDP 化。
    boss_city: ""                 # 可选城市代码（如北京 101010100）；空=全国
  browser:
    # 容器里看到的客户端 IP 是网桥网关（如 172.18.0.1），不是 loopback；
    # 用 container 放行私有网段，与 compose 的 127.0.0.1 端口绑定配对使用。
    local_guard: container
  registry:
    internal: [rag_query, memory_search, memory_write, profile_update, search_jobs, salary_query, read_image, submit_application]
    mcp: [google_mcp]
  hitl:
    requires_confirmation:
      - submit_application

hitl:
  default_policy: confirm

# ── HR 回复监听（投递闭环：招呼发出 -> 回复捕获 -> 情景记忆 -> 顾问接聊） ──
hr_monitor:
  enabled: false                  # 需 Boss CDP 渠道（tools.search.boss_cdp_url）已配置
  interval_minutes: 30            # 轮询间隔
  cdp_url: ""                     # 空=复用 tools.search.boss_cdp_url

langsmith:
  enabled: false                    # 需要追踪时置 true 并提供 LANGSMITH_API_KEY
  project: careercrew
  api_key: "${LANGSMITH_API_KEY}"
  masking: true
  max_chars: 2000

oss:
  endpoint: "${OSS_ENDPOINT}"
  access_key_id: "${OSS_ACCESS_KEY_ID}"
  access_key_secret: "${OSS_ACCESS_KEY_SECRET}"
  bucket_name: "${OSS_BUCKET_NAME}"
  dir_prefix: uploads

auth:
  environment: production           # compose 部署视为生产（强制 jwt_secret ≥32 字符）
  database_url: "${AUTH_DATABASE_URL}"
  trusted_origins: ["http://localhost:8000", "http://127.0.0.1:8000"]  # 有域名/LB 时在此追加
  login_max_failures: 5
  login_failure_window_minutes: 15
  login_lock_minutes: 15
  cleanup_interval_hours: 6
  jwt_secret: "${AUTH_JWT_SECRET}"
  access_token_minutes: 15
  refresh_token_days: 7
  # 生产校验强制 true；现代浏览器把 http://localhost 视为可信上下文，
  # Secure Cookie 在本机 compose 验证同样可用。经纯 HTTP 局域网访问时需自建配置。
  cookie_secure: true
  # LB/Nginx 后部署置 true：登录限流按 X-Forwarded-For 取真实客户端 IP
  trust_proxy_headers: false
