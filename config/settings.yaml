# CareerCrew 主配置（结构对齐 DEV_SPEC §5.5）
# ${VAR} 占位由 careercrew_core/state/settings.py 的 load_settings 做环境变量替换

# ── LLM（阿里云百炼平台，OpenAI 兼容；init_chat_model 薄适配） ──
llm:
  provider: openai               # 走 init_chat_model 的 openai provider（OpenAI 兼容）
  model: "qwen-plus"             # 阿里云百炼主力模型：通义千问 Plus（兼具高性能、精准工具调用与极速响应）
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "${DASHSCOPE_API_KEY}"
  temperature: 0.3
  max_tokens: 4096

# ── Embedding（本地 BGE-M3 三合一：dense + sparse + colbert） ──
embedding:
  provider: bge_m3_local         # bge_m3_local | openai
  model: BAAI/bge-m3
  model_path: "${CAREERCREW_EMBEDDING_MODEL_PATH:-F:/AI_models/BAAI--bge-m3/snapshots/master}"
  use_fp16: false                # CPU 跑关闭 fp16；device=cuda 时建议改 true
  batch_size: 12
  device: cpu                    # cpu（默认，避免显存叠加 OOM）| cuda（有卡机型提速明显）

# ── Rerank（阿里云百炼 rerank API / 本地 BGE / 无） ──
rerank:
  backend: dashscope             # dashscope | local_bge | none
  model: "gte-rerank-v2"         # 阿里云百炼最新多语言重排模型：gte-rerank-v2
  base_url: "https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank"
  api_key: "${DASHSCOPE_API_KEY}"
  top_m: 30                      # 精排候选数

# ── 向量库（Qdrant 唯一后端） ──
vector_store:
  backend: qdrant
  url: "${QDRANT_URL:-http://localhost:6333}"
  api_key: "${QDRANT_API_KEY}"
  colbert_multivector: false    # M7：ColBERT 原生 multivector（服务端 MAX_SIM），
                                # 需与 rag.retrieval.colbert_rerank 同开；存量集合自动补加向量字段，
                                # 旧数据需重新摄取才有精排效果
  collections:
    knowledge: careercrew_mm
    episodic_memory: careercrew_episodic_v2
    conversation_messages: careercrew_workspace_messages

# ── RAG 检索（自建） ──
rag:
  retrieval:
    mode: hybrid                 # hybrid | dense | sparse
    fusion_algorithm: rrf        # rrf | weighted_sum
    top_k_dense: 20
    top_k_sparse: 20
    top_k_final: 10
    crag: false                  # M5：检索质量自评估（incorrect -> LLM 重写重检一轮）
    colbert_rerank: false        # M7：ColBERT late-interaction 精排总开关
    colbert_store: false         # M7：payload 方案（本地 MaxSim）；multivector 开启时无需
  chunking:
    strategy: recursive
    chunk_size: 800
    chunk_overlap: 100
    contextual: false            # 全局默认：每块一次 LLM 调用，摄取成本高
    contextual_by_category: {}   # 知识库级覆盖（M 批次）：{分类id: true/false}，
                                 # 未声明的分类回落上方全局值。例：{"interview": true}
  loaders:
    backend: mineru              # MinerU 子进程解析（PDF/图片/docx/pptx/xlsx）
    provider: api                # api（云端精准解析，推荐，本机零推理负载）| local（本地子进程）
    api_key: "${MINERU_API_KEY}" # MinerU 云端 API token（provider=api 时必填）
    model_version: vlm           # pipeline | vlm（推荐）| MinerU-HTML
    poll_interval: 5             # API 轮询间隔（秒）
    timeout: 1800                # API 任务最长等待（秒）
    output_dir: ./data/parsed    # MinerU 产物落盘（页面图/对象裁剪图/Markdown）
    device: cpu                  # MinerU 子进程设备：cpu（8GB 显存机型避免 GPU OOM）
    method: auto                 # auto | txt（纯文本 PDF 最快）| ocr（强制 OCR）
    formula: true                # 公式识别开关；无公式文档关掉可显著提速
    table: true                  # 表格识别开关
    language: ch                 # 文档语言（API 参数）

# ── VLM（阿里云百炼平台，多模态生成） ──
vlm:
  model: "qwen-vl-max"          # 阿里云百炼视觉大模型
  rerank_model: ""
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "${DASHSCOPE_API_KEY}"

# ── LangGraph supervisor ──
supervisor:
  checkpointer:
    backend: postgres            # 唯一后端：postgres
    url: "${DATABASE_URL}"
  max_consecutive_agent_turns: 10

# ── 记忆系统 ──
memory:
  enabled: true                  # 功能可用；实际默认关闭由 memory_global_policy + 用户策略控制
  postgres:
    dsn: "${DATABASE_URL}"
  episodic:
    collection: careercrew_episodic_v2
    vectorize: true
  compaction:
    enabled: true
    token_threshold_ratio: 0.7   # token 占比阈值（用模型真实 usage）
    retention_tokens: 20000      # 保留区大小
  router:
    top_n: 5                     # LLM 路由每次最多选出的语义事实数
    max_inject_tokens: 2000      # 自动注入总 token 预算
  consolidation:
    min_interval_hours: 24       # Auto Dream 式时间门控
    min_sessions: 5              # 距上次合并至少新增会话数

# ── 工具层 ──
tools:
  search:
    boss_cdp_url: "http://127.0.0.1:9222"   # Chrome CDP 调试端口（Boss直聘与猎聘双渠道）
                                 # 运行 scripts/start_chrome_cdp.ps1 后填 http://127.0.0.1:9222 启用
    boss_city: ""                # 可选城市代码（如北京 101010100）；空=全国
  registry:
    # internal 须与 `_make_tools(kind)` 实际构造的工具集对齐：search_jobs(matcher) /
    # salary_query(planner+salary) / read_image(knowledge) 均真实落入 bound tools，
    # 必须登记在此，否则默认路径（未传 tools）会把它们从 bound 集合裁剪掉以致功能回归。
    internal: [rag_query, memory_search, memory_write, profile_update, search_jobs, salary_query, read_image, submit_application]
    mcp: [google_mcp]
  hitl:
    requires_confirmation:
      - submit_application

# ── HITL 默认策略 ──
hitl:
  default_policy: confirm        # 默认 HITL，仅低风险自动化

# ── HR 回复监听（投递闭环：招呼发出 -> 回复捕获 -> 情景记忆 -> 顾问接聊） ──
hr_monitor:
  enabled: false                 # 需 Boss CDP 渠道（tools.search.boss_cdp_url）已配置
  interval_minutes: 30           # 轮询间隔
  cdp_url: ""                    # 空=复用 tools.search.boss_cdp_url

# ── LangSmith 全链路追踪 ──
langsmith:
  enabled: true
  project: careercrew
  api_key: "${LANGSMITH_API_KEY}"
  masking: true              # 默认脱敏：截断 + 打码手机号/邮箱/薪资
  max_chars: 2000            # 单条字符串上传上限（超出截断）

# ── 阿里云 OSS（头像等文件存储；未配置时回退本地 data/uploads） ──
oss:
  endpoint: "${OSS_ENDPOINT}"
  access_key_id: "${OSS_ACCESS_KEY_ID}"
  access_key_secret: "${OSS_ACCESS_KEY_SECRET}"
  bucket_name: "${OSS_BUCKET_NAME}"
  dir_prefix: uploads             # 对象键前缀：头像落在 {dir_prefix}/avatars/{user_id}/...

# ── 本地账号认证 ──
# 账号/刷新会话存 Postgres（唯一后端；AUTH_DATABASE_URL 未设置时回退 DATABASE_URL）。
auth:
  environment: development   # 可用 CAREERCREW_ENV 覆盖为 production
  database_url: "${AUTH_DATABASE_URL}"
  trusted_origins: ["http://localhost:5175", "http://127.0.0.1:5175", "http://localhost:5276", "http://127.0.0.1:5276", "http://localhost:8100", "http://127.0.0.1:8100"]
  login_max_failures: 5
  login_failure_window_minutes: 15
  login_lock_minutes: 15
  cleanup_interval_hours: 6
  jwt_secret: "${AUTH_JWT_SECRET}"
  access_token_minutes: 15
  refresh_token_days: 7
  cookie_secure: false       # 生产环境必须为 true
  # 反向代理（LB/Nginx）后部署时设 true：登录限流按 X-Forwarded-For 取真实客户端 IP；
  # 直连部署保持 false（该头可伪造，信任它等于给限流开绕通道）
  trust_proxy_headers: false
