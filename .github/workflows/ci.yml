# CareerCrew CI：分层流水线（快速单测 / API / Postgres / 类型编译检查 / 前端构建）
# + PR 变更行 80% 覆盖率门禁（diff-cover）+ docker 镜像构建冒烟 + 依赖漏洞审计
# + nightly integration/e2e。
# 重 ML 栈（FlagEmbedding / torch / BGE-M3）由本地 conda env 验证（DEV_SPEC §4.4）。
#
# 版本口径说明：各 job 手写的轻量依赖清单是「CI 已验证的已知可用版本集」，
# 均不低于 pyproject.toml 的声明下限；调整任一侧时需同步核对另一侧。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 新运行不要打断正在跑的 nightly 长任务；显式取消仍由人工操作。
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lightweight deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock pytest-check pydantic PyYAML python-dotenv numpy \
            "langgraph>=1.2.0" "langchain>=1.0.0" "langchain-core>=1.0.0" "langchain-openai>=1.0.0" \
            "langchain-text-splitters>=0.3.0" "qdrant-client>=1.19.0" "langgraph-checkpoint-sqlite>=3.0.0" \
            "psycopg[binary]>=3.1.0" "psycopg-pool>=3.2" "mcp>=1.20,<2" "pymupdf>=1.24.0" "requests>=2.31.0" \
            fastapi "PyJWT>=2.10" "argon2-cffi>=23.1"
          pip install -e . --no-deps
      - name: Validate migration graph and checksums
        run: python scripts/validate_migrations.py --static

      - name: Unit tests (full offline suite)
        env:
          SILICONFLOW_API_KEY: "sk-test-ci-dummy"
        # 重 ML 栈（FlagEmbedding/torch）不进 CI：integration 标记的用例归 nightly，
        # smoke 测试对重依赖自动 skip（tests/unit/test_smoke_imports.py）
        run: |
          pytest -q tests/unit -m "not integration"

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careercrew
          POSTGRES_PASSWORD: careercrew
          POSTGRES_DB: careercrew
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careercrew -d careercrew"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install API deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock pytest-check pytest-cov fastapi uvicorn python-multipart \
            "PyJWT>=2.10" "argon2-cffi>=23.1" pydantic PyYAML python-dotenv numpy \
            "langgraph>=1.2.0" "langchain>=1.0.0" "langchain-core>=1.0.0" "langchain-openai>=1.0.0" \
            "qdrant-client>=1.19.0" "langgraph-checkpoint-sqlite>=3.0.0" "psycopg[binary]>=3.1.0" "psycopg-pool>=3.2"
          pip install -e . --no-deps
      - name: API tests (FakeRuntime) with coverage
        env:
          SILICONFLOW_API_KEY: "sk-test-ci-dummy"
          # 新 auth 要求 DSN（load_auth_settings 强制）；lifespan 的 get_auth_service
          # 会构造 PostgresAccountStore（立即建表），故提供真实 postgres service
          DATABASE_URL: "postgresql://careercrew:careercrew@localhost:5432/careercrew"
        run: |
          pytest -q tests/api --cov=careercrew_api --cov=careercrew_core --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  postgres-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careercrew
          POSTGRES_PASSWORD: careercrew
          POSTGRES_DB: careercrew
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careercrew -d careercrew"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Postgres memory test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest "psycopg[binary]>=3.1.0" "psycopg-pool>=3.2" "langchain-core>=1.0.0" numpy pydantic
          pip install -e . --no-deps
      - name: Postgres episodic-memory regression test
        env:
          POSTGRES_TEST_DSN: postgresql://careercrew:careercrew@localhost:5432/careercrew
        run: |
          pytest -q tests/integration/test_postgres_memory_db.py

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff lint (config in pyproject.toml)
        run: |
          pip install ruff
          ruff check careercrew_ai careercrew_core careercrew_api careercrew_mcp tests scripts
      - name: Compile check (syntax + import-free bytecode)
        run: |
          python -m compileall -q careercrew_api careercrew_core careercrew_ai

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: careercrew_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: careercrew_web/package-lock.json
      - name: Install and verify
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

  eval-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline eval non-regression gate
        run: |
          python scripts/eval_runner.py --offline --compare data/eval/baseline.json --fail-on-regression

  docker-build:
    # 守住「克隆即跑」承诺：镜像必须可构建，且容器内 alembic 能对
    # postgresql+psycopg:// 方言 DSN 完成 baseline 迁移（compose 注入该写法）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build app image (multi-stage)
        run: docker build -t careercrew:ci .
      - name: "Smoke: alembic upgrade head with dialect DSN"
        run: |
          docker network create ccnet
          docker run -d --name pg --network ccnet \
            -e POSTGRES_USER=careercrew -e POSTGRES_PASSWORD=careercrew -e POSTGRES_DB=careercrew \
            postgres:16
          docker exec pg sh -c 'until pg_isready -U careercrew; do sleep 1; done'
          docker run --rm --network ccnet \
            -e DATABASE_URL="postgresql+psycopg://careercrew:careercrew@pg:5432/careercrew" \
            careercrew:ci alembic upgrade head
          docker run --rm --network ccnet \
            -e DATABASE_URL="postgresql+psycopg://careercrew:careercrew@pg:5432/careercrew" \
            careercrew:ci sh -c 'python scripts/validate_migrations.py --database-url "$DATABASE_URL"'

  security-audit:
    # 已知依赖集的 CVE 扫描（重 ML 栈 torch/FlagEmbedding 不装，覆盖面以轻量清单为准）。
    # 高危依赖漏洞必须阻断合入；例外需通过依赖升级或显式安全评审处理。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared deps (light set)
        run: |
          python -m pip install --upgrade pip
          pip install "langgraph>=1.2.0" "langchain>=1.0.0" "langchain-core>=1.0.0" "langchain-openai>=1.0.0" \
            "langchain-text-splitters>=0.3.0" "qdrant-client>=1.19.0" "langgraph-checkpoint-postgres>=2.0.0" \
            "psycopg[binary]>=3.1.0" "psycopg-pool>=3.2" "alembic>=1.13" "mcp>=1.20,<2" "pymupdf>=1.24.0" \
            "requests>=2.31.0" "pydantic>=2.7.0" "PyYAML>=6.0" "python-dotenv>=1.0.0" \
            "fastapi>=0.115" "uvicorn>=0.30" "python-multipart>=0.0.9" "PyJWT>=2.10" "argon2-cffi>=23.1"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --skip-editable

  coverage-gate:
    needs: [api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Changed-lines 80% coverage gate (diff-cover)
        run: |
          pip install diff-cover
          git fetch origin main --depth=1 || true
          diff-cover coverage.xml --compare-branch=origin/main --fail-under=80 \
            --html-report diff-cover.html
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-cover-report
          path: diff-cover.html
          retention-days: 7

  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careercrew
          POSTGRES_PASSWORD: careercrew
          POSTGRES_DB: careercrew
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careercrew -d careercrew"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install integration deps (unit ∪ api 轻量全集)
        # 曾因只装 pytest+psycopg 导致收集阶段 import fastapi 即崩、
        # 叠加 continue-on-error 而静默失效——依赖清单必须覆盖全部被测模块的导入面。
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock pytest-check fastapi uvicorn python-multipart \
            "PyJWT>=2.10" "argon2-cffi>=23.1" pydantic PyYAML python-dotenv numpy \
            "langgraph>=1.2.0" "langchain>=1.0.0" "langchain-core>=1.0.0" "langchain-openai>=1.0.0" \
            "langchain-text-splitters>=0.3.0" "qdrant-client>=1.19.0" "langgraph-checkpoint-sqlite>=3.0.0" \
            "psycopg[binary]>=3.1.0" "psycopg-pool>=3.2" "mcp>=1.20,<2" "pymupdf>=1.24.0" "requests>=2.31.0"
          pip install -e . --no-deps
      - name: Integration / e2e
        env:
          SILICONFLOW_API_KEY: "sk-test-ci-dummy"
          POSTGRES_TEST_DSN: postgresql://careercrew:careercrew@localhost:5432/careercrew
        run: |
          pytest -q -m "integration or e2e"
